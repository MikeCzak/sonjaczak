---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      # Uncomment when the homepage is configured, or change the path to check
      # - name: Check HTTPS reachability
      #   run: curl -v --insecure --fail-with-body https://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?match=test
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction --allow-no-migration
      # Rendered templates reference the compiled CSS, which is not part of the repository
      - name: Build Sass
        run: docker compose exec -T php bin/console -e test sass:build
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      # PHPStan reads the compiled dev container (see phpstan.dist.neon)
      - name: Warm up dev cache
        run: docker compose exec -T php bin/console -e dev cache:warmup
      - name: Run PHPStan
        run: docker compose exec -T php vendor/bin/phpstan analyse --no-progress --memory-limit=512M
  build:
    name: Build
    needs: tests
    # Only commits on main produce deployable images, pull requests are tested only
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Read by compose.prod.yaml: image = ${IMAGES_PREFIX}app-php-prod:${IMAGE_TAG}
      IMAGES_PREFIX: ghcr.io/mikeczak/sonjaczak/
      IMAGE_TAG: ${{ github.sha }}
      # Dummy values, only for the smoke test below; real secrets live on the server
      APP_SECRET: ci-smoke-test
      CADDY_MERCURE_JWT_SECRET: ci-smoke-test-mercure-jwt-secret
      POSTGRES_PASSWORD: ci-smoke-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.prod.yaml
          set: |
            *.cache-from=type=gha,scope=prod
            *.cache-to=type=gha,scope=prod,mode=max
      - name: Start production stack
        run: docker compose -f compose.yaml -f compose.prod.yaml up --wait --no-build
      - name: Smoke test
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml exec -T php bin/console about
          docker compose -f compose.yaml -f compose.prod.yaml exec -T php bin/console dbal:run-sql "SELECT 1"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: docker push "${IMAGES_PREFIX}app-php-prod:${IMAGE_TAG}"
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Secrets of the "production" environment are only available to this job
    environment: production
    # Never run two deployments at once, and never cancel a running one
    concurrency:
      group: production
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key instead of trusting whatever answers on first connect
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        # The key's forced command on the server runs deploy.sh with this hash as its only input
        run: ssh -o BatchMode=yes "deploy@${SSH_HOST}" "$IMAGE_TAG"
