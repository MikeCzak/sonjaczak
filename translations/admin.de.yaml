password_mail:
    reset:
        subject: Neues Passwort für sonjaczak.com
        intro: 'Für dein Konto im Verwaltungsbereich von sonjaczak.com wurde ein neues Passwort angefordert. Mit diesem Link kannst du es setzen:'
    invitation:
        subject: Dein Zugang zu sonjaczak.com
        intro: 'Für dich wurde ein Konto im Verwaltungsbereich von sonjaczak.com angelegt. Mit diesem Link setzt du dein Passwort:'
    expires: Der Link läuft in %time% ab und funktioniert nur einmal.
    ignore: Falls du das nicht warst, kannst du diese E-Mail ignorieren. Dein Passwort bleibt unverändert.
