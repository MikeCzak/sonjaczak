        title: Konto bearbeiten
    flash:
        saved: Das Konto ist gespeichert.
        invited: Die Einladung ist verschickt.
        invitation_throttled: Vor weniger als einer Stunde wurde schon ein Link verschickt. Der ist noch gültig; einen neuen gibt es frühestens eine Stunde danach.
        deactivated: Das Konto ist deaktiviert. Offene Anmeldungen enden beim nächsten Seitenaufruf.
        own_account: Rolle und Zugang des eigenen Kontos kann nur ein anderes Konto mit Benutzerverwaltung ändern.
