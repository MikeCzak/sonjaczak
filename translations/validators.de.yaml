# Messages for our own constraints; Symfony's built-in messages are translated by the Validator component itself.
# Neutral wording (no "Sie"/"Du"): the lessons page addresses visitors with "Du".
inquiry:
    phone:
        invalid: Erlaubt sind Ziffern, Leerzeichen und + / ( ) -.
    date:
        past: Das Datum darf nicht in der Vergangenheit liegen.
    guardian:
        required: Bei Schüler:innen unter 18 Jahren bitte den Namen einer erziehungsberechtigten Person angeben.
