# Messages for our own constraints; Symfony's built-in messages are translated by the Validator component itself.
# Neutral wording (no "Sie"/"Du"): the lessons page addresses visitors with "Du".
inquiry:
    phone:
        invalid: Erlaubt sind Ziffern, Leerzeichen und + / ( ) -.
    date:
        past: Das Datum darf nicht in der Vergangenheit liegen.
    guardian:
        required: Bei Schüler:innen unter 18 Jahren bitte den Namen einer erziehungsberechtigten Person angeben.
user:
    email:
        taken: Für diese E-Mail-Adresse gibt es bereits ein Konto.
password:
    too_short: Das Passwort muss mindestens {{ limit }} Zeichen lang sein.
    too_weak: Das Passwort ist zu leicht zu erraten. Länger oder abwechslungsreicher wählen.
    current_wrong: Das aktuelle Passwort stimmt nicht.
course:
    ends_before_start: Das Ende muss nach dem Beginn liegen.
course_break:
    ends_before_start: „Bis“ darf nicht vor „Von“ liegen.
