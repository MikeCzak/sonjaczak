lessons:
    # Draft
    intro: >-
        Du möchtest singen lernen oder deine Stimme weiterentwickeln? Im Gesangsunterricht bei Sonja arbeitest du an
        Songs, die du selbst auswählst, und findest Schritt für Schritt deine eigene Stimme.
    content:
        heading: Was du lernst
        items: |-
            Atemtechnik und Stimmbildung
