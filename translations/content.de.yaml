            beginnt meist im Oktober. Unterrichtet wird an einem fixen Tag pro Woche, die Uhrzeit vereinbarst du mit Sonja.
    prices:
        heading: Preise
        body: € 495,– pro Semester (15 Einheiten, entspricht € 33,– pro Einheit). Unterricht zu zweit ist auf Anfrage möglich.
