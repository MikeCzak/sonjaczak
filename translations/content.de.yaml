# Page content, grouped by page and section. Parts of this move to the CMS later.
# An empty string hides the section in the template.
# Multi-line values (|-): a blank line starts a new paragraph, in lists every line is one item.
# "Draft" marks texts written by Claude from the known facts, to be reviewed by Mike.

home:
    hero:
        # One sentence by Sonja, editable in the CMS later
        claim: ''
    intro:
        heading: Willkommen
        # Draft
        body: >-
            Sonja Czak ist Sängerin und Gesangslehrerin aus Frohnleiten. Sie singt bei Trauungen, Taufen und Feiern in
            der Steiermark – solo mit Stagepiano oder gemeinsam mit der Band Red Mullet – und unterrichtet Gesang am
            Bundesgymnasium Rein bei Graz.
    offers:
        solo:
            heading: Sonja solo
            body: Gesang und Stagepiano für Trauungen, Taufen und andere besondere Anlässe in der Steiermark.
        band:
            heading: Sonja mit Band
            body: Mit der Band Red Mullet für Hochzeiten, Galas, Firmenfeiern, Bälle und Silvesterpartys.
        lessons:
            heading: Gesangsunterricht
            body: Unterricht für Anfänger:innen und Fortgeschrittene ab 12 Jahren – Pop, Rock, Funk, Soul, Musical und Jazz.

about:
    # Paragraph 1 by Mike (inhalte.md E39), paragraph 2 draft
    body: |-
        Sonja studierte in Wien Jazz- und Populargesang sowie Instrumental- und Gesangspädagogik und ist seit 2012 hauptberuflich als Sängerin und Gesangslehrerin tätig. Live-Erfahrung in unterschiedlichsten Formationen – von Ska-Punk über Funk bis Jazz – prägt ihren Unterricht ebenso wie Workshops und die Arbeit mit renommierten Musiker:innen.

        Heute verbindet sie beides: Als Sängerin gestaltet sie Trauungen, Taufen und Feiern in der Steiermark, solo mit Gesang und Stagepiano oder mit ihrer Band Red Mullet. Als Gesangslehrerin unterrichtet sie am Bundesgymnasium Rein Jugendliche und Erwachsene und begleitet sie dabei, ihre eigene Stimme zu finden.
    image_alt: Porträt von Sonja Czak

booking:
    # Overview with one image section per offer
    solo:
        body: Gesang und Stagepiano für Trauungen, Taufen und andere besondere Anlässe in der Steiermark.
    band:
        body: Mit der Band Red Mullet für Hochzeiten, Galas, Firmenfeiern, Bälle und Silvesterpartys.

booking_solo:
    # Draft
    intro: >-
        Gesang und Stagepiano für die besonderen Momente: Sonja gestaltet Ihre Trauung, Taufe oder Feier musikalisch
        und stimmt die Musik auf Ihre Wünsche und den Ablauf des Tages ab.
    occasions:
        heading: Anlässe
        items: |-
            Trauung – standesamtlich, kirchlich oder frei
            Taufe
            Agape
            Firmenfeier
            Geburtstag
    services:
        heading: Was dabei ist
        items: |-
            Gesang und Stagepiano
            Eigener Lautsprecher und Mikrofon
            Alle Stative
        note: Ein Mikrofon für Reden gibt es auf Anfrage.
    region:
        heading: Region und Preise
        body: >-
            Sonja tritt in der ganzen Steiermark auf. Ab 15 km Entfernung von Frohnleiten fallen Fahrtkosten an.
            Preise erhalten Sie auf Anfrage.
    process:
        heading: So läuft eine Buchung ab
        items: |-
            Anfrage: Sie schreiben Sonja mit Datum, Ort und Anlass.
            Gespräch: Persönlich, telefonisch oder per E-Mail klären Sie gemeinsam Ablauf und Musikwünsche.
            Angebot: Sie erhalten ein Angebot.
            Bestätigung: Mit Ihrer Bestätigung ist der Termin fix.
    cancellation:
        heading: Stornobedingungen
        intro: 'Bei einer Absage fallen Stornogebühren an, gestaffelt nach dem Datum der Absage:'
        items: |-
            Bis 90 Tage vor dem Termin: Einbehalt der Anzahlung (25 % der Gesamtgage)
            90 bis 60 Tage vor dem Termin: 50 % der vereinbarten Gage
            60 bis 14 Tage vor dem Termin: 75 % der vereinbarten Gage
            Ab 14 Tage vor dem Termin oder bei Nicht-Erscheinen: 100 % der vereinbarten Gage
        clauses: |-
            Berechnungsbasis: Alle Stornogebühren beziehen sich auf die reine Gage (ohne eventuelle Fahrtkosten).
            Verschiebung: Bei einer Terminverschiebung kann aus Kulanz auf Stornogebühren verzichtet werden, sofern der neue Termin frei ist und fest gebucht wird.
            Höhere Gewalt: Bei behördlichen Verboten oder unvorhersehbaren Katastrophen entfällt die Stornopflicht.
            Krankheit der Sängerin: Fällt Sonja selbst aus, entfällt das Honorar; nach Verfügbarkeit sucht sie aktiv nach gleichwertigem Ersatz.
    inquiry:
        heading: Anfrage
        # Draft
        body: Schreiben Sie Sonja mit Datum, Ort und Anlass – sie meldet sich bei Ihnen.
        mail_subject: Anfrage Booking solo

