---
# Production environment override
services:
  php:
    # CI and server set IMAGES_PREFIX=ghcr.io/mikeczak/sonjaczak/ and IMAGE_TAG=<commit hash>
    image: ${IMAGES_PREFIX:-}app-php-prod:${IMAGE_TAG:-latest}
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET must be set}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET must be set}
      # smtps://<mailbox, URL-encoded>:<password, URL-encoded>@smtp.ionos.de:465
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN must be set}
      # Extra Caddy site (inserted by frankenphp/Caddyfile): www gets its own certificate and redirects permanently
      # to the main domain, so every page has one address. Needs a DNS record for www (docs/deployment.md, S10).
      CADDY_EXTRA_CONFIG: |
        www.${SERVER_NAME:-localhost} {
            redir https://${SERVER_NAME:-localhost}{uri} permanent
        }

  database:
    restart: unless-stopped
    environment:
      # No fallback to the "!ChangeMe!" default from compose.yaml in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # Small server (~850 MiB RAM): keep PostgreSQL's memory footprint low.
    # FrankenPHP starts 2 workers per CPU, each holding at most one connection.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
