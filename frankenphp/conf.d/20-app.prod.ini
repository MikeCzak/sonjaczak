; https://symfony.com/doc/current/performance.html#use-the-opcache-class-preloading
opcache.preload_user = www-data
opcache.preload = /app/config/preload.php
; https://symfony.com/doc/current/performance.html#don-t-check-php-files-timestamps
opcache.validate_timestamps = 0

; The slim prod image has no OpenSSL default CA directory, only this bundle. SSL_CERT_FILE (Dockerfile) points to it,
; but does not reach PHP inside the FrankenPHP worker, so TLS from PHP (e.g. SMTP to smtp.ionos.de) failed with
; "certificate verify failed". https://www.php.net/manual/en/openssl.configuration.php
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
