# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Public address and recipient of all inquiry forms (sender: config/packages/mailer.yaml)
    app.contact_email: 'music@sonjaczak.com'
    # Site settings (App\Theme\SiteSettings), later changed by Sonja in the admin area.
    # Theme: a value of App\Theme\Theme. Slides: image name and object-position, shown in this order.
    app.theme: 'classic'
    app.home_slides:
        - { image: 'hero-sonja2', position: '60% 35%' }
        - { image: 'hero-sax', position: '60% 30%' }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Sessions of the admin area in PostgreSQL (config/packages/framework.yaml, framework.session.handler_id).
    # Uses Doctrine's connection instead of its own: one database connection less (max_connections is 20), and
    # always the same database as Doctrine, also app_test in tests (otherwise the schema listener ignores the table).
    # Advisory locks instead of the default LOCK_TRANSACTIONAL: that one keeps a transaction open on the shared
    # connection from reading to saving the session, and Doctrine's own transactions would collide with it.
    app.session_pdo:
        class: PDO
        factory: ['@doctrine.dbal.default_connection', 'getNativeConnection']
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '@app.session_pdo'
            - { lock_mode: !php/const Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler::LOCK_ADVISORY }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Recorded OpenHolidays answers (config/packages/framework.yaml, when@test)
        App\Tests\Http\OpenHolidaysResponses: ~
