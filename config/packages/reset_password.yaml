# Links to set a new password ("Passwort vergessen", later invitations): docs/planung/rollen.md 4.2
symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Defaults of the bundle, written out so they are visible (DependencyInjection/Configuration.php):
    # a link is valid for 1 hour, and a new one can be requested 1 hour after the previous one at the earliest
    lifetime: 3600
    throttle_limit: 3600
