# Passkeys (umsetzung-admin.md B5, decisions 2026-11-17). Options: vendor/web-auth/webauthn-symfony-bundle/src/
# DependencyInjection/Configuration.php (5.3.13), checked in the code because the bundle's documentation has gaps.
webauthn:
    credential_repository: App\Repository\PasskeyRepository
    user_repository: App\Repository\PasskeyUserRepository
    # No allowed_origins: the response's origin must then be https and its host the relying party ID, which is the
    # host of the request (lib CheckAllowedOrigins). That is localhost here and sonjaczak.com in production, without
    # an extra setting; allowed_origins would also add the public route /.well-known/webauthn.
    creation_profiles:
        default:
            authenticator_selection_criteria:
                # Fingerprint or device PIN every time (Mike, 2026-11-17, question 2)
                user_verification: required
                # Stored on the device ("discoverable"): login without typing the e-mail address
                resident_key: required
    request_profiles:
        default:
            user_verification: required
